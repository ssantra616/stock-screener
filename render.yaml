# Render Blueprint — deploy with one click via "New Web Service" → connect repo
services:
  - type: web
    name: us-stock-screener
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
